name: Deploy AI Photo Quiz to GitHub Pages

on:
  push:
    branches:
      - claude/ai-photo-detection-quiz-3P9dK
      - master
    paths:
      - 'ai-photo-quiz/**'
      - '.github/workflows/pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Inject Firebase config from secret
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -z "$FIREBASE_CONFIG_JSON" ]; then
            echo "::warning::FIREBASE_CONFIG_JSON secret is not set — deploying with placeholders (app will fall back to localStorage)."
            exit 0
          fi
          # Validate JSON
          echo "$FIREBASE_CONFIG_JSON" | jq -e . > /dev/null
          # Write firebase-config.js with injected values
          {
            echo "// Auto-generated by GitHub Actions from FIREBASE_CONFIG_JSON secret."
            echo "// Do not edit — changes to this file in production come from the secret."
            printf 'window.FIREBASE_CONFIG = %s;\n' "$(echo "$FIREBASE_CONFIG_JSON" | jq -c .)"
          } > ai-photo-quiz/firebase-config.js
          echo "Firebase config injected."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './ai-photo-quiz'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
